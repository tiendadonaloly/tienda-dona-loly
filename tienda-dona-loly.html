<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Doña Loly</title>
  <style>
    /* Encabezado no fijo */
    header.encabezado-tienda {
      position: relative;
      width: 100%;
      padding: 16px;
      background: #18181b;
      color: #ffffff;
      z-index: 1;
    }


    /* Serie de luces de aguinaldo parpadeantes */
    .luces-aguinaldo {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #09090b;
      overflow: hidden;
    }


    .bombillo {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: parpadeo-aguinaldo 1.4s infinite alternate ease-in-out;
    }


    .bombillo:nth-child(2n) {
      animation-delay: 0.35s;
    }


    .bombillo:nth-child(3n) {
      animation-delay: 0.7s;
    }


    .bombillo.rojo {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }


    .bombillo.verde {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }


    .bombillo.dorado {
      background: #facc15;
      box-shadow: 0 0 10px #facc15;
    }


    .bombillo.azul {
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }


    @keyframes parpadeo-aguinaldo {
      0% {
        opacity: 0.25;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1.15);
      }
    }


    main.catalogo-contenedor {
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="luces-aguinaldo" aria-hidden="true">
    <span class="bombillo rojo"></span>
    <span class="bombillo verde"></span>
    <span class="bombillo dorado"></span>
    <span class="bombillo azul"></span>
    <span class="bombillo rojo"></span>
    <span class="bombillo verde"></span>
    <span class="bombillo dorado"></span>
    <span class="bombillo azul"></span>
  </div>


  <header class="encabezado-tienda">
    <h1>Tienda Doña Loly</h1>
  </header>


  <main class="catalogo-contenedor">
    <!-- Aquí van tus categorías, productos, tasas y carrito de WhatsApp -->
  </main>
</body>
</html>
